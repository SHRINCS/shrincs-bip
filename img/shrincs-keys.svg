<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Inter, ui-sans-serif, system-ui, monospace">
  <rect width="980" height="430" fill="#24262b"/>

  <text x="40" y="48" fill="#e8eaf0" font-size="24" font-weight="700">SHRINCS Key Formats</text>
  <text x="40" y="70" fill="#aab0bf" font-size="13">offsets shown in bytes</text>

  <!-- Public key -->
  <text x="40" y="120" fill="#ffffff" font-size="16" font-weight="700">SHRINCS public key • 48 bytes</text>

  <g transform="translate(40,150)">
    <rect x="0" y="0" width="384" height="64" rx="8" fill="#343842" stroke="#4b5161"/>
    <rect x="0" y="0" width="128" height="64" fill="#3b82f6" fill-opacity="0.34"/>
    <rect x="128" y="0" width="128" height="64" fill="#22c55e" fill-opacity="0.34"/>
    <rect x="256" y="0" width="128" height="64" fill="#f59e0b" fill-opacity="0.38"/>

    <line x1="128" y1="0" x2="128" y2="64" stroke="#8b93a7"/>
    <line x1="256" y1="0" x2="256" y2="64" stroke="#8b93a7"/>

    <text x="64" y="30" text-anchor="middle" fill="#dbeafe" font-size="14" font-weight="700">pk_seed</text>
    <text x="64" y="48" text-anchor="middle" fill="#bfdbfe" font-size="12">16</text>

    <text x="192" y="30" text-anchor="middle" fill="#dcfce7" font-size="14" font-weight="700">sl_root</text>
    <text x="192" y="48" text-anchor="middle" fill="#bbf7d0" font-size="12">16</text>

    <text x="320" y="30" text-anchor="middle" fill="#fef3c7" font-size="14" font-weight="700">sf_root</text>
    <text x="320" y="48" text-anchor="middle" fill="#fde68a" font-size="12">16</text>

    <text x="0" y="-10" fill="#aab0bf" font-size="11">0</text>
    <text x="128" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">16</text>
    <text x="256" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">32</text>
    <text x="384" y="-10" text-anchor="end" fill="#aab0bf" font-size="11">48</text>

    <path d="M0 80 L256 80" stroke="#22c55e" stroke-width="3"/>
    <text x="128" y="100" text-anchor="middle" fill="#86efac" font-size="12">first 32 bytes: valid SLH-DSA public key</text>
  </g>

  <!-- Secret key -->
  <text x="40" y="290" fill="#ffffff" font-size="16" font-weight="700">SHRINCS secret key • 82 bytes</text>

  <g transform="translate(40,324)">
    <rect x="0" y="0" width="656" height="64" rx="8" fill="#343842" stroke="#4b5161"/>
    <rect x="0" y="0" width="128" height="64" fill="#a855f7" fill-opacity="0.34"/>
    <rect x="128" y="0" width="128" height="64" fill="#ec4899" fill-opacity="0.30"/>
    <rect x="256" y="0" width="128" height="64" fill="#3b82f6" fill-opacity="0.34"/>
    <rect x="384" y="0" width="128" height="64" fill="#22c55e" fill-opacity="0.34"/>
    <rect x="512" y="0" width="16" height="64" fill="#ef4444" fill-opacity="0.45"/>
    <rect x="528" y="0" width="128" height="64" fill="#f59e0b" fill-opacity="0.38"/>

    <g stroke="#8b93a7">
      <line x1="128" y1="0" x2="128" y2="64"/>
      <line x1="256" y1="0" x2="256" y2="64"/>
      <line x1="384" y1="0" x2="384" y2="64"/>
      <line x1="512" y1="0" x2="512" y2="64"/>
      <line x1="528" y1="0" x2="528" y2="64"/>
    </g>

    <text x="64" y="30" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="700">sk_seed</text>
    <text x="64" y="48" text-anchor="middle" fill="#e9d5ff" font-size="11">16</text>

    <text x="192" y="30" text-anchor="middle" fill="#fce7f3" font-size="13" font-weight="700">sk_prf</text>
    <text x="192" y="48" text-anchor="middle" fill="#fbcfe8" font-size="11">16</text>

    <text x="320" y="30" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="700">pk_seed</text>
    <text x="320" y="48" text-anchor="middle" fill="#bfdbfe" font-size="11">16</text>

    <text x="448" y="30" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="700">sl_root</text>
    <text x="448" y="48" text-anchor="middle" fill="#bbf7d0" font-size="11">16</text>

    <text x="520" y="25" text-anchor="middle" fill="#fee2e2" font-size="10" font-weight="700">struct</text>
    <text x="520" y="45" text-anchor="middle" fill="#fecaca" font-size="10">2</text>

    <text x="592" y="30" text-anchor="middle" fill="#fef3c7" font-size="13" font-weight="700">sf_root</text>
    <text x="592" y="48" text-anchor="middle" fill="#fde68a" font-size="11">16</text>

    <text x="0" y="-10" fill="#aab0bf" font-size="11">0</text>
    <text x="128" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">16</text>
    <text x="256" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">32</text>
    <text x="384" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">48</text>
    <text x="512" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">64</text>
    <text x="528" y="-10" text-anchor="middle" fill="#aab0bf" font-size="11">66</text>
    <text x="656" y="-10" text-anchor="end" fill="#aab0bf" font-size="11">82</text>

    <path d="M0 78 L512 78" stroke="#22c55e" stroke-width="3"/>
    <text x="256" y="96" text-anchor="middle" fill="#86efac" font-size="12">first 64 bytes: valid SLH-DSA secret key</text>
  </g>
</svg>
